name: CI

on:
  push:
    branches: [main, update]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so that an advisory published after the last commit still
    # surfaces. Nothing else here depends on the passage of time.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs against the committed synthetic fixture, never the full dataset.
  TVZ_LOG_LEVEL: WARNING

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The raw CSVs are large; nothing in CI reads them.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data

      # Pinned to a full version: this action publishes floating major tags
      # only up to v7, so `@v9` does not resolve even though v9.0.0 exists.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          # One Windows run, because the analysis is developed there and path
          # handling and line endings differ.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --cov-fail-under=80 --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `uv sync --locked` above would also catch a stale lockfile, but this
      # fails in seconds and says plainly what is wrong.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `uvx` runs the auditor without adding it to the project's own
      # dependencies, which would otherwise appear in the lockfile it audits.
      - name: pip-audit
        run: |
          # The project itself is not on PyPI, so auditing it can only be skipped
          # (on a 404) or fail outright (on a PyPI outage, as happened in September
          # 2026). Audit the dependencies, not the package.
          uv export --format requirements-txt --no-hashes --all-extras --no-emit-project > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt
