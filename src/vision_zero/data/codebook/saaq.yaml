          en: At least one victim died within 30 days following the accident or no death and
            at least one victim seriously injured (injuries requiring hospitalization, including
            those for which the person remains under observation in hospital).
          fr: Au moins une victime décédée dans les 30 jours suivant l'accident ou aucun décès
            et au moins une victime blessée gravement (blessures nécessitant l'hospitalisation,
            incluant celles pour lesquelles la personne demeure en observation à l'hôpital).
        short:
