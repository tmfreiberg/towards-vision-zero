  RDWX:
    source_column: CD_ZON_TRAVX_ROUTR
    label:
      en: Work zone
      fr: Zone de travaux
    type: categorical
    summary:
      en: Indicates that the accident took place near or in a work zone.
      fr: Indicateur si l'accident a eu lieu près ou dans une zone de travaux.
    values:
      Y:
        label:
          en: Y
          fr: O
        gloss:
          en: |2-

            * Approaching the area. Area upstream of the work where drivers are notified of changes in lanes, speed reduction, passing bans, etc.
            * In the zone. Area where there are changes to the road configuration or authorized speed to allow work, or where there is mobile work.
          fr: |2-

            * Aux approches de la zone. Zone en amont des travaux où les conducteurs sont avisés des changements de voies, de la réduction de vitesse, des interdictions de passer, etc.
            * Dans la zone. Zone où il y a des modifications de la configuration de la route ou de la vitesse autorisée afin de permettre les travaux, ou dans laquelle il y a des travaux mobiles.
        short:
          en: Y
          fr: O
        code: 1
    notes:
      en: The published documentation lists only the positive value. The data carries it on
        a small minority of records and is blank on the rest; whether a blank means 'not in
        a work zone' or 'not recorded' cannot be determined from the documentation.
      fr: La documentation publiée ne mentionne que la valeur positive. Les données la portent
        sur une faible minorité d'enregistrements et sont vides pour les autres; la documentation
        ne permet pas de déterminer si une valeur vide signifie « hors zone de travaux » ou
        « non consigné ».
