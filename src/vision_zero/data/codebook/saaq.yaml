          fr: Mortel/grave
        code: 3
      Minor:
        label:
          en: Minor
          fr: Léger
        gloss:
          en: Only one or more victims lightly injured (injuries not requiring hospitalization
            or observation of the person, even if they require treatment by a doctor or in
            a hospital center).
          fr: Seulement une ou plusieurs victimes blessées légèrement (blessures ne nécessitant
            pas l'hospitalisation ni la mise en observation de la personne, même si elles
            exigent des traitements chez un médecin ou dans un centre hospitalier).
        short:
          en: Minor
          fr: Léger
        code: 2
      Material damage only:
        label:
          en: Material damage only
          fr: Dommages matériels seulement
        gloss:
          en: No victims, and the damage assessment is above the reporting threshold (threshold
            of $2,000 since March 2010).
          fr: Aucune victime, et l'évaluation des dommages est supérieure au seuil de rapportage
            (seuil de 2 000$ depuis mars 2010).
        short:
          en: Mat
          fr: Mat
        code: 1
      Material damage below the reporting threshold:
        label:
          en: Material damage below the reporting threshold
          fr: Dommages matériels inférieurs au seuil de rapportage
        gloss:
          en: No victims, and the assessment of damage is less than or equal to the reporting
            threshold (threshold of $2,000 since March 2010).
          fr: Aucune victime, et l'évaluation des dommages est inférieure ou égale au seuil
            de rapportage (seuil de 2 000$ depuis mars 2010).
        short:
          en: Mat < 2000
          fr: Mat < 2000
        code: 0
