# The SAAQ collision codebook, in English and French.
#
# The SAAQ documents this dataset in a French-language PDF: one row per
# variable, giving its name, its permitted values, and a definition of each.
# This file is that documentation in machine-readable form, with an English
# translation alongside.
#
# Provenance, field by field:
#
#   source_column   The published French column name, verbatim.
#   label.fr        The published *description variable*, shortened to fit a
#                   form label. The SAAQ's words.
#   label.en        Translated here.
#   summary         The published variable description. French verbatim,
#                   English translated here.
#   values[].label  The published value names. French verbatim where the value
#                   is named rather than coded; English translated here.
#   values[].gloss  The published *description valeur* and *explication
#                   valeur*. French verbatim, English translated here.
#   values[].code   The integer encoding used by this project. Not published.
#   missing         Present where the documentation shows a "Non précisé" row,
#                   which carries a blank *valeur possible*: a blank field is
#                   the code, not a category of its own.
#   notes           Recorded where the published documentation is incomplete.
#
# So every French string here is either the SAAQ's or a shortening of it, and
# every English string is an original translation. Where the two disagree, the
# French is authoritative.
#
# Citation: SOCIÉTÉ DE L'ASSURANCE AUTOMOBILE DU QUÉBEC (SAAQ). Rapports
# d'accident, [Jeu de données], dans Données Québec, 2017, mis à jour le
# 18 décembre 2023. https://www.donneesquebec.ca/recherche/dataset/rapports-d-accident
#
# This file is edited by hand. It is the source of truth for what every
# variable and value means, and is read by the package, the book and the
# explorer alike.

schema_version: 1
dataset: saaq
source:
  publisher: Société de l'assurance automobile du Québec
  url: https://www.donneesquebec.ca/recherche/dataset/rapports-d-accident
  accessed: '2024-03-13'
languages:
  - en
  - fr
variables:
  YEAR:
    source_column: AN
    label:
      en: Year
      fr: Année
    type: categorical
    summary:
      en: Year of accident (YYYY).
      fr: Année de l'accident (AAAA).
  ASPECT:
    source_column: CD_ASPCT_ROUTE
    label:
      en: Road alignment
      fr: Aspect de la route
    type: categorical
    summary:
      en: Appearance of the road at the scene of the accident at the time of impact and in
        its immediate surroundings depending on the field of vision of a driver seated at
        the wheel of their vehicle.
      fr: Aspect de la route sur le lieu de l'accident au moment de l'impact et dans son entourage
        immédiat en fonction du champ de vision d'un conducteur assis au volant de son véhicule.
    values:
      Straight:
        label:
          en: Straight
          fr: Droit
        gloss:
          en: Roadway where the direction of traffic is relatively straight.
          fr: Chaussée où la direction de la circulation est relativement droite.
        short:
          en: Straight
          fr: Droit
        code: 0
      Curve:
        label:
          en: Curve
          fr: Courbe
        gloss:
          en: Roadway where the direction of traffic turns to the left or right.
          fr: Chaussée où la direction de la circulation tourne vers la gauche ou vers la
            droite.
        short:
          en: Curve
          fr: Courbe
        code: 1
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  PUB_PRIV_RD:
    source_column: CD_CATEG_ROUTE
    label:
      en: Road category
      fr: Catégorie de route
    type: categorical
    summary:
      en: Category of road on which the first physical event (impact) occurred.
      fr: Catégorie de route sur laquelle le premier fait physique (impact) s'est produit.
    values:
      '1':
        label:
          en: '1'
          fr: '1'
        gloss:
          en: 'Public road. Examples: numbered road, ramp, highway collector, service road,
            main artery, residential street, path, row, alley.'
          fr: 'Chemin public. Exemples: route numérotée, bretelle, collecteur d''autoroute,
            voie de service, artère principale, rue résidentielle, chemin, rang, ruelle.'
        short:
          en: Public
          fr: Chemin public
        code: 0
      '2':
        label:
          en: '2'
          fr: '2'
        gloss:
          en: 'Off public roads. Examples: parking lot, private land, private road, forest
            road, marked trail.'
          fr: 'Hors chemin public. Exemples: terrain de stationnement, terrain privé, chemin
            privé, chemin forestier, sentier balisé.'
        short:
          en: Private
          fr: Hors chemin public
        code: 1
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  WEATHER:
    source_column: CD_COND_METEO
    label:
      en: Weather
      fr: Conditions météorologiques
    type: categorical
    summary:
      en: 'Meteorological conditions: Atmospheric conditions present during the accident.'
      fr: 'Conditions météorologiques: Conditions atmosphériques présentes lors de l''accident.'
    values:
      '11':
        label:
          en: '11'
          fr: '11'
        gloss:
          en: Clear. Total absence of clouds or presence of clouds which does not have the
            effect of darkening or making vision less distinct.
          fr: Clair. Absence totale de nuages ou présence de nuages qui n'a pas pour effet
            d'assombrir ou de rendre la vision moins distincte.
        short:
          en: Clear
          fr: Clair
        code: 0
      '12':
        label:
          en: '12'
          fr: '12'
        gloss:
          en: Overcast (cloudy/dark). Sky covered with dark, thick clouds which have the effect
            of darkening and making vision less distinct.
          fr: Couvert (nuageux/sombre). Ciel couvert de nuages sombres et épais ayant pour
            effet d'assombrir et de rendre la vision moins distincte.
        short:
          en: Overcast
          fr: Couvert (nuageux/sombre)
        code: 1
      '13':
        label:
          en: '13'
          fr: '13'
        gloss:
          en: Fog/haze. "Opaque white smoke" formed from very small water droplets suspended
            in the air.
          fr: Brouillard/brume. « Fumée blanche opaque » formée de très petites gouttelettes
            d'eau en suspension dans l'air.
        short:
          en: Fog/haze
          fr: Brouillard/brume
        code: 2
      '14':
        label:
          en: '14'
          fr: '14'
        gloss:
          en: Rain/drizzle. Regular and continuous fall of water droplets coming from the
            clouds.
          fr: Pluie/bruine. Tombée régulière et continue de gouttelettes d'eau venant des
            nuages.
        short:
          en: Rain/drizzle
          fr: Pluie/bruine
        code: 3
      '15':
        label:
          en: '15'
          fr: '15'
        gloss:
          en: Downpour (heavy rain). Sudden and heavy rain.
          fr: Averse (pluie forte). Pluie soudaine et abondante.
        short:
          en: Downpour
          fr: Averse (pluie forte)
        code: 4
      '16':
        label:
          en: '16'
          fr: '16'
        gloss:
          en: Strong wind (no blowing snow, no rain). Air movement which has the effect of
            making a vehicle less stable on the road.
          fr: Vent fort (pas de poudrerie, pas de pluie). Déplacement d'air qui a pour effet
            de rendre un véhicule moins stable sur la route.
        short:
          en: Strong wind
          fr: Vent fort
        code: 5
      '17':
        label:
          en: '17'
          fr: '17'
        gloss:
          en: Snow/hail. Falling water droplets crystallized in the form of snow or hail.
          fr: Neige/grêle. Tombée de gouttelettes d'eau cristallisées sous forme de neige
            ou de grêle.
        short:
          en: Snow/hail
          fr: Neige/grêle
        code: 6
      '18':
        label:
          en: '18'
          fr: '18'
        gloss:
          en: Blowing snow/snowstorm. Windblown snow (often gusty) or snowfall accompanied
            by strong wind.
          fr: Poudrerie/tempête. de neige Neige chassée par le vent (souvent en rafales) ou
            chute de neige accompagnée d'un vent violent.
        short:
          en: Blowing snow/snowstorm
          fr: Poudrerie/tempête
        code: 7
      '19':
        label:
          en: '19'
          fr: '19'
        gloss:
          en: Black ice. A layer of ice, generally very thin, which forms when supercooled
            rain falls in contact with solid bodies below zero degrees Celsius.
          fr: Verglas. Couche de glace, généralement très mince, qui se forme lorsque tombe
            une pluie surfondue venant en contact avec des corps solides au-dessous de zéro
            degré Celsius.
        short:
          en: Black ice
          fr: Verglas
        code: 8
      '99':
        label:
          en: '99'
          fr: '99'
        gloss:
          en: Other. Any atmospheric condition, other than those described above.
          fr: Autre. Toute condition atmosphérique, autre que celles décrites précédemment.
        short:
          en: Other
          fr: Autre
        code: 9
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  RD_CONFG:
    source_column: CD_CONFG_ROUTE
    label:
      en: Road configuration
      fr: Configuration de la route
    type: categorical
    summary:
      en: 'Road configuration: Lane characteristics. If the accident takes place at an intersection,
        the most important street of this intersection is described.'
      fr: 'Configuration de la route: Caractéristiques des voies. Si l''accident a lieu à
        une intersection, la rue la plus importante de cette intersection est décrite.'
    values:
      '1':
        label:
          en: '1'
          fr: '1'
        gloss:
          en: One-way. Vehicle traffic is authorized in one direction only, indicated by an
            arrow.
          fr: Sens unique. La circulation des véhicules est autorisée dans une direction seulement,
            indiquée par une flèche.
        short:
          en: One-way
          fr: Sens unique
        code: 0
      '23':
        label:
          en: '23'
          fr: '23'
        gloss:
          en: Two-way. Vehicles move in both directions.
          fr: Deux sens. Les véhicules se déplacent dans les deux directions.
        short:
          en: Two-way
          fr: Deux sens
        code: 1
      '45':
        label:
          en: '45'
          fr: '45'
        gloss:
          en: Separated by layout. Traffic flows are separated by a physical layout.
          fr: Séparée par aménagement. Les courants de circulation sont séparés par un aménagement
            physique.
        short:
          en: Sep by layout
          fr: Séparée par aménagement
        code: 2
      '9':
        label:
          en: '9'
          fr: '9'
        gloss:
          en: 'Other. Any configuration, other than those mentioned previously. Examples:
            markers, left turn lane in both directions.'
          fr: 'Autre. Toute configuration, autre que celles mentionnées précédemment. Exemples:
            balises, voie de virage à gauche dans les deux sens. '
        short:
          en: Other
          fr: Autre
        code: 3
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  LIGHT:
    source_column: CD_ECLRM
    label:
      en: Lighting
      fr: Éclairement
    type: ordinal
    summary:
      en: 'Illumination: Degree of clarity of the premises at the time of the accident. Illumination
        refers to two periods of a day, day and night.'
      fr: 'Éclairement: Degré de clarté des lieux au moment de l''accident. L''éclairement
        fait référence à deux périodes d''une journée, soit le jour et la nuit.'
    values:
      '1':
        label:
          en: '1'
          fr: '1'
        gloss:
          en: 'Day and clarity. Day: Period between half an hour before sunrise and half an
            hour after sunset. Clarity: Refers to the period between sunrise and sunset.'
          fr: 'Jour et clarté. Jour: Période comprise entre une demi-heure avant le lever
            du soleil et une demi-heure après son coucher. Clarté: Fait référence à la période
            comprise entre le lever du soleil et son coucher.'
        short:
          en: Clear day
          fr: Jour et clarté
        code: 3
      '2':
        label:
          en: '2'
          fr: '2'
        gloss:
          en: 'Day and half darkness. Day: Period between half an hour before sunrise and
            half an hour after sunset. Half-darkness: Refers to the period between night and
            sunrise and the period between sunset and night.'
          fr: 'Jour et demi-obscurité. Jour: Période comprise entre une demi-heure avant le
            lever du soleil et une demi-heure après son coucher. Demi-obscurité: Fait référence
            à la période entre la nuit et le lever du soleil et à la période entre le coucher
            du soleil et la nuit.'
        short:
          en: Dawn/dusk
          fr: Jour et demi-obscurité
        code: 2
      '3':
        label:
          en: '3'
          fr: '3'
        gloss:
          en: 'Night and lit path. Night: Period between half an hour after sunset and one
            half an hour before getting up. Illuminated path: Path along which lighting equipment
            is installed which was operating at the time of the accident.'
          fr: 'Nuit et chemin éclairé. Nuit: Période comprise entre une demi-heure après le
            coucher du soleil et une demi-heure avant son lever. Chemin éclairé: Chemin le
            long duquel sont installés des équipements d''éclairage qui fonctionnaient au
            moment de l''accident.'
        short:
          en: Lit path
          fr: Nuit et chemin éclairé
        code: 1
      '4':
        label:
          en: '4'
          fr: '4'
        gloss:
          en: 'Night and unlit path. Night: Period between half an hour after sunset and one
            half an hour before getting up. Unlit path: Path along which, in the immediate
            area of the accident, no lighting equipment is installed or the equipment in place
            was not functioning.'
          fr: 'Nuit et chemin non éclairé. Nuit: Période comprise entre une demi-heure après
            le coucher du soleil et une demi-heure avant son lever. Chemin non éclairé: Chemin
            le long duquel, dans la région immédiate de l''accident, aucun équipement d''éclairage
            n''est installé ou l''équipement en place ne fonctionnait pas.'
        short:
          en: Unlit path
          fr: Nuit et chemin non éclairé
        code: 0
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  ZONE:
    source_column: CD_ENVRN_ACCDN
    label:
      en: Surroundings
      fr: Environnement
    type: categorical
    summary:
      en: 'Zone: Dominant activity in the sector where the accident occurred.'
      fr: 'Environnement: Activité dominante du secteur où l''accident s''est produit.'
    values:
      '1':
        label:
          en: '1'
          fr: '1'
        gloss:
          en: School. Immediate area of an educational institution.
          fr: Scolaire. Région immédiate d'un établissement d'enseignement.
        short:
          en: School
          fr: Scolaire
        code: 0
      '2':
        label:
          en: '2'
          fr: '2'
        gloss:
          en: Residential. Mainly residential sector.
          fr: Résidentiel. Secteur domiciliaire principalement.
        short:
          en: Residential
          fr: Résidentiel
        code: 1
      '3':
        label:
          en: '3'
          fr: '3'
        gloss:
          en: Business/commercial. Sector where the main activity is commercial, administrative
            or business.
          fr: Affaires / commercial. Secteur où l'activité principale est d'ordre commercial,
            administratif ou d'affaires.
        short:
          en: Business/commercial
          fr: Affaires/commercial
        code: 2
      '4':
        label:
          en: '4'
          fr: '4'
        gloss:
          en: Industrial / manufacturing. Sector where the main activity is industrial, manufacturing.
          fr: Industriel / manufacturier. Secteur où l'activité principale est d'ordre industriel,
            manufacturier.
        short:
          en: Industrial
          fr: Industriel
        code: 3
      '5':
        label:
          en: '5'
          fr: '5'
        gloss:
          en: Rural. Sector outside the limits of cities, towns and villages, except the forestry
            sector.
          fr: Rural. Secteur hors des limites des cités, villes et villages, sauf le secteur
            forestier.
        short:
          en: Rural
          fr: Rural
        code: 4
      '6':
        label:
          en: '6'
          fr: '6'
        gloss:
          en: Forest road. Sector where the main activity is logging or forestry, even if
            there is found some homes.
          fr: Forestier. Secteur où l'activité principale est l'exploitation forestière ou
            forêt, même si on y trouve quelques habitations.
        short:
          en: Forest
          fr: Forestier
        code: 5
      '9':
        label:
          en: '9'
          fr: '9'
        gloss:
          en: Other (e.g. lake, recreational, park, campsite). Any dominant activity in the
            sector, other than those mentioned previously.
          fr: Autre (ex. lac, récréatif, parc, camping). Toute activité dominante du secteur,
            autre que celles mentionnées précédemment.
        short:
          en: Other
          fr: Autre
        code: 6
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  RD_COND:
    source_column: CD_ETAT_SURFC
    label:
      en: Road surface
      fr: État de la surface
    type: categorical
    summary:
      en: Condition of the road surface during the accident.
      fr: État de la surface de roulement lors de l'accident.
    values:
      '11':
        label:
          en: '11'
          fr: '11'
        gloss:
          en: Dry. Surface that has not received any liquid or any material that affects tire
            grip.
          fr: Sèche. Surface qui n'a reçu aucun liquide ou aucun matériau nuisant à l'adhérence
            des pneus.
        short:
          en: Dry
          fr: Sèche
        code: 0
      '12':
        label:
          en: '12'
          fr: '12'
        gloss:
          en: Wet. Surface which has received a liquid likely to reduce adhesion between the
            vehicle and the surface (other than an oily or greasy substance).
          fr: Mouillée. Surface qui a reçu un liquide de nature à diminuer l'adhérence entre
            le véhicule et la surface (autre qu'une substance huileuse ou graisseuse).
        short:
          en: Wet
          fr: Mouillée
        code: 1
      '13':
        label:
          en: '13'
          fr: '13'
        gloss:
          en: Water accumulation (hydroplaning). Surface where a film of water between the
            road surface and the tires causes loss complete grip of a vehicle.
          fr: Accumulation d'eau (aquaplanage). Surface où une pellicule d'eau entre la chaussée
            et les pneus entraîne la perte complète d'adhérence d'un véhicule.
        short:
          en: Water acc
          fr: Acc. d'eau
        code: 2
      '14':
        label:
          en: '14'
          fr: '14'
        gloss:
          en: Sand, gravel on the roadway. Surface covered with sand or gravel.
          fr: 'Sable, gravier sur la chaussée. Surface couverte de sable ou de gravier. '
        short:
          en: Sand/gravel
          fr: Sable/gravier
        code: 3
      '15':
        label:
          en: '15'
          fr: '15'
        gloss:
          en: Slush/sleet. Surface that is covered with wet snow or slush.
          fr: Gadoue/neige fondante. Surface qui est couverte de neige mouillée ou de neige
            fondante.
        short:
          en: Slush/sleet
          fr: Gadoue/neige fondante
        code: 4
      '16':
        label:
          en: '16'
          fr: '16'
        gloss:
          en: Snowy. Surface that is covered with snow.
          fr: Enneigée. Surface qui est couverte de neige.
        short:
          en: Snowy
          fr: Enneigée
        code: 5
      '17':
        label:
          en: '17'
          fr: '17'
        gloss:
          en: Hard snow. Surface covered with snow that is compacted and hardened.
          fr: Neige durcie. Surface couverte de neige qui est compactée et qui a durci.
        short:
          en: Hard snow
          fr: Neige durcie
        code: 6
      '18':
        label:
          en: '18'
          fr: '18'
        gloss:
          en: Frozen. Surface that has lost its grip following the appearance of ice.
          fr: 'Glacée. Surface qui a perdu son adhérence à la suite de l''apparition de glace. '
        short:
          en: Frozen
          fr: Glacée
        code: 7
      '19':
        label:
          en: '19'
          fr: '19'
        gloss:
          en: Muddy. Surface of a dirt road following rain or any other surface that has lost
            its grip due to the presence of mud.
          fr: Boueuse. Surface d'un chemin de terre à la suite d'une pluie ou toute autre
            surface qui a perdu de son adhérence par la présence de boue.
        short:
          en: Muddy
          fr: Boueuse
        code: 8
      '20':
        label:
          en: '20'
          fr: '20'
        gloss:
          en: Oily. Presence of oil or greasy product on the road.
          fr: Huileuse. Présence d'huile ou de produit graisseux sur la chaussée.
        short:
          en: Oily
          fr: Huileuse
        code: 9
      '99':
        label:
          en: '99'
          fr: '99'
        gloss:
          en: Other. Any surface condition, other than those described previously.
          fr: Autre. Tout état de la surface, autre que ceux décrits précédemment.
        short:
          en: Other
          fr: Autre
        code: 10
    missing:
      label:
        en: Unspecified
        fr: Non précisé
  ACCDN_TYPE:
    source_column: CD_GENRE_ACCDN
    label:
      en: Type of collision
      fr: Genre d'accident
    type: categorical
    summary:
      en: 'Type of accident: Used to indicate the nature of the accident and the first physical
        event (impact).'
      fr: 'Genre d''accident: Sert à indiquer la nature de l''accident et le premier fait
        physique (impact).'
    values:
      vehicle:
        label:
          en: vehicle
          fr: véhicule
        gloss:
          en: 'Collision with road vehicle. Road vehicle: automobile or light truck, truck,
            road tractor, tool vehicle, equipment vehicle, bus, minibus, taxi, emergency vehicle,
            motorcycle, moped, recreational vehicle, snowmobile, VHR, motorcycle covered by
            the VHR law.'
          fr: 'Collision avec véhicule routier. Véhicule routier: automobile ou camion léger,
            camion, tracteur routier, véhicule outil, véhicule d''équipement, autobus, minibus,
            taxi, véhicule d''urgence, motocyclette, cyclomoteur, véhicule récréatif, motoneige,
            VHR, motocyclette visée par la loi VHR.'
        short:
          en: veh
          fr: véhicule
        code: 0
      pedestrian:
        label:
          en: pedestrian
          fr: piéton
        gloss:
          en: Collision with pedestrian. Any person who walks, pulls, pushes an object or
            is on or in this object. Any person who uses equipment that is not authorized
            to travel on a public road is considered a pedestrian.
          fr: Collision avec piéton. Toute personne qui circule à pied, tire, pousse un objet
            ou se trouve sur ou dans cet objet. Toute personne qui utilise un équipement qui
            n'est pas autorisé à circuler sur un chemin public est assimilée à un piéton.
        short:
          en: ped
          fr: piéton
        code: 1
      cyclist:
        label:
          en: cyclist
          fr: cycliste
        gloss:
          en: Collision with cyclist. Any person who rides a bicycle (assisted or not), tricycle,
            unicycle or quadricycle.
          fr: Collision avec cycliste. Toute personne qui circule à bicyclette (assistée ou
            non), en tricycle, en monocycle ou en quadricycle.
        short:
          en: cyc
          fr: cycliste
        code: 2
      animal:
        label:
          en: animal
          fr: animal
        gloss:
          en: Collision with animal. Domestic or wild animal.
          fr: Collision avec animal. Animal domestique ou sauvage.
        short:
          en: anim
          fr: animal
        code: 3
      fixed object:
        label:
          en: fixed object
          fr: objet fixe
        gloss:
          en: |2-

            * Lamp: Fixed support used to support lighting equipment.
            * Support/signal light: Support used to permanently support traffic signs or traffic lights.
            * Pole (public service): Fixed support used to support public utility equipment, other than a street lamp or a traffic light.
            * Tree: Any species of tree, excluding hedges.
            * Crash barrier section: Section of a protective device made of corrugated iron, concrete (New Jersey) or steel, used to retain road vehicles leaving the roadway.
            * Impact attenuator: Safety device installed in front of fixed obstacles along a road to reduce bodily injury and property damage when a vehicle leaves the road in front of the obstacle.
            * End of guardrail: End of guardrail, excluding impact attenuators.
            * Pillar (bridge/tunnel): Part of a structure (bridge, tunnel, viaduct) which supports the load.
            * Snow drift: Snow accumulation.
            * Building/edifice/wall: Includes, among others, any construction used to shelter individuals, animals or things.
            * Curb/sidewalk: Strip that limits the edge of the roadway or shoulder, or raised path running along a street and reserved for pedestrians.
            * Fire hydrant: Piece of equipment serving as a water point and generally used to fight a fire.
            * Fence/barrier: Enclosure which demarcates a space. Also includes hedges.
            * Ditch: Trench or canal built along a road, used for the flow of water.
            * Rock wall: Rock wall along a road.
            * Culvert: Drainage pipe, generally made of concrete or metal, used to pass water under a road, an entrance, an access.
            * Other fixed object: Any object involved in a collision, other than those described previously.
          fr: |2-

            * Lampadaire: Support fixe servant à soutenir des équipements d'éclairage.
            * Support/feu de signalisation: Support servant à soutenir de façon permanente des panneaux de signalisation ou des feux de signalisation.
            * Poteau (service public): Support fixe servant à soutenir des équipements d'utilité publique, autre qu'un lampadaire ou un feu de signalisation.
            * Arbre: Toute espèce d'arbres, excluant les haies.
            * Section de glissière de sécurité: Section d'un dispositif de protection en tôle ondulée, en béton (New Jersey) ou en acier, servant à retenir les véhicules routiers quittant la chaussée.
            * Atténuateur d'impact: Dispositif de sécurité installé devant des obstacles fixes le long d'une route pour réduire les préjudices corporels et les dommages matériels, lorsqu'un véhicule quitte la route devant l'obstacle.
            * Extrémité de glissière de sécurité: Bout de la glissière, excluant les atténuateurs d'impact.
            * Pilier (pont/tunnel): Partie d'une structure (pont, tunnel, viaduc) qui en supporte la charge.
            * Amoncellement de neige: Accumulation de neige.
            * Bâtiment/édifice/mur: Comprend, entre autres, toute construction servant à abriter des individus, des animaux ou des choses.
            * Bordure/trottoir: Bande qui limite le bord de la chaussée ou l'accotement, ou chemin surélevé longeant une rue et réservé aux piétons.
            * Borne-fontaine: Pièce d'équipement servant de point d'eau et généralement utilisée pour combattre un incendie.
            * Clôture/barrière: Enceinte qui délimite un espace. Inclut aussi les haies.
            * Fossé: Tranchée ou canal aménagé le long d'une route, servant à l'écoulement de l'eau.
            * Paroi rocheuse: Mur de roc longeant une route.
            * Ponceau: Conduite de drainage, généralement en béton ou en métal, servant au passage de l'eau sous une route, une entrée, un accès.
            * Autre objet fixe: Tout objet impliqué dans une collision, autre que ceux décrits précédemment.
        short:
          en: fxd obj
          fr: objet fixe
        code: 4
      no collision:
        label:
          en: no collision
          fr: sans collision
        gloss:
          en: |2-

            * Rollover: When a vehicle has overturned or rolled over.
            * Rollover: When a vehicle ends up on one of its sides, without having rolled over.
            * Submersion/watercourse: When a vehicle has plunged into water or finds itself in a watercourse (e.g.: river, lake).
            * Fire/explosion: When a vehicle catches fire or explodes.
            * Leaves the roadway: When a vehicle leaves the running surface following the loss of driver control.
            * Other: Any non-collision event, other than those described previously.
          fr: |2-

            * Capotage: Lorsqu'un véhicule a culbuté ou capoté.
            * Renversement: Lorsqu'un véhicule se retrouve sur un de ses côtés, sans avoir capoté.
            * Submersion/cours d'eau: Lorsqu'un véhicule a plongé dans l'eau ou qu'il se retrouve dans un cours d'eau (ex.: rivière, lac).
            * Feu/explosion: Lorsqu'un véhicule a pris feu ou a explosé.
            * Quitte la chaussée: Lorsqu'un véhicule quitte la surface de roulement à la suite de la perte de contrôle du conducteur.
            * Autre: Tout événement sans collision, autre que ceux décrits précédemment.
        short:
          en: no coll
          fr: sans collision
        code: 5
      other:
        label:
          en: other
          fr: autre
        gloss:
          en: 'Other type of collision. Any kind of collision, other than those described
            above. Examples: a collision with a train, a temporary obstacle or an object projected/detached.'
          fr: 'Autre genre de collision. Tout genre de collision, autre que ceux décrits précédemment.
            Exemples: une collision avec un train, un obstacle temporaire ou un objet projeté/détaché.'
        short:
          en: oth
          fr: autre
        code: 6
    missing:
      label:
        en: Unspecified
        fr: Non précisé
